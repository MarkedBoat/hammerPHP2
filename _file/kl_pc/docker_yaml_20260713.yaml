version: '3.8'

services:
  kl_desktop_php8:
    image: php:8.2.2-fpm
    container_name: kl_desktop_php8
    privileged: true
    user: "0:0"  # 使用 UID:GID 格式，0:0 表示 root
    cap_add:
      - ALL  # 添加所有 Linux 能力
    security_opt:
      - seccomp=unconfined  # 禁用安全配置
    extra_hosts:  # 添加主机映射
      - "kl-home-pc:172.17.0.1"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - /mnt/f/doc/show/app/web:/web:rw
      - /mnt/f/doc/show:/show:rw
      - /mnt/f:/mnt/f:rw
      # php-fpm 配置文件挂载（挂载到 /etc/ 兼容旧 docker run 命令，再复制到官方镜像 /usr/local/etc 路径生效）
      #- /mnt/f/doc/show/_file/kl_pc/php.ini:/etc/php.ini:rw
      #- /mnt/f/doc/show/_file/kl_pc/php-fpm.conf:/etc/php-fpm.conf:rw
      #- /mnt/f/doc/show/_file/kl_pc/php-fpm.d:/etc/php-fpm.d:rw
    ports:
      - "49082:9000"
    command: >
      sh -c "
      ln -s /show/hammer /hammer &&
      chmod +x /hammer &&
      ln -s /usr/local/bin/php /usr/bin/php &&
      chown -R root:root /var/www/html &&
      docker-php-ext-install pdo pdo_mysql &&
      docker-php-ext-enable pdo pdo_mysql &&      
      php-fpm -R
      "

    #mkdir -p /var/log/php-fpm /run/php-fpm &&
    #      cp -f /etc/php.ini /usr/local/etc/php/php.ini &&
    #      cp -f /etc/php-fpm.conf /usr/local/etc/php-fpm.conf &&
    #      mkdir -p /etc/php-fpm.d &&
    #      if [ ! -f /etc/php-fpm.d/www.conf ]; then cp -f /usr/local/etc/php-fpm.d/www.conf /etc/php-fpm.d/www.conf; fi &&

    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: kl_desktop_nginx
    privileged: true
    user: "0:0"  # 使用 UID:GID 格式
    cap_add:
      - ALL
    security_opt:
      - seccomp=unconfined
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - /mnt/f/doc/show/_file/kl_pc/nginx.conf:/etc/nginx/nginx.conf:rw
      - /mnt/f/doc/show/app/web:/web:rw
      - /mnt/f/doc/show:/show:rw
      - /mnt/f:/mnt/f:rw
    ports:
      - "8001:80"
    depends_on:
      - kl_desktop_php8
    command: >
      sh -c "
      chown -R root:root /var/cache/nginx &&
      chown -R root:root /var/log/nginx &&
      nginx -g 'daemon off; user root; error_log /dev/stderr debug;'
      "
    restart: unless-stopped

networks:
  default:
    name: kl_desktop_network
    driver: bridge