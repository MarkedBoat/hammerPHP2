; ============================================
; OPcache 配置（php:8.2-fpm 官方镜像）
; 挂载到 /usr/local/etc/php/conf.d/opcache.ini
; 官方镜像已内置 opcache.so，只需 zend_extension=opcache 即可加载
; ============================================

zend_extension=opcache

; --- 核心开关 ---
opcache.enable=1
opcache.enable_cli=0
; 说明：FPM 下开启；CLI 默认关（CLI 脚本短命，缓存收益低，cli 模式下调试时不易踩缓存）
; 如果你想在 CLI 下跑 artisan / composer 之类也加速，可改成 1

; --- 内存与文件数 ---
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; --- 文件更新检测 ---
opcache.validate_timestamps=1
opcache.revalidate_freq=2
; 生产环境追求极致性能可改为 validate_timestamps=0 + revalidate_freq=0，但改代码必须重启 FPM

; --- 其它常用项 ---
opcache.save_comments=1
; 保守保留注释，兼容依赖注解的框架（如 Doctrine、部分 PHPUnit 特性）

; --- JIT（PHP 8.0+，可选，先别开）---
; opcache.jit=tracing
; opcache.jit_buffer_size=64M
; 打开前先压测确认收益，且 validate_timestamps=0 时 JIT 效果才明显