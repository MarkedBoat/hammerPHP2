version: '3.8'

services:
  kl_desktop_es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: kl_desktop_es
    privileged: true
    user: "0:0"
    cap_add:
      - ALL
    security_opt:
      - seccomp=unconfined
    environment:
      - TZ=Asia/Shanghai
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    sysctls:
      - vm.max_map_count=262144
    volumes:
      - /code/show/data/es:/usr/share/elasticsearch/data:rw
      - /mnt/f:/mnt/f:rw
      # 如需自定义 elasticsearch.yml，先创建文件再放开（同上，文件不存在会变目录）
      #- /code/show/_file/kl_pc/es.yml:/usr/share/elasticsearch/config/elasticsearch.yml:rw
    ports:
      - "9200:9200"
      - "9300:9300"
    command: >
      sh -c "
      mkdir -p /usr/share/elasticsearch/data &&
      (chown -R elasticsearch:elasticsearch /usr/share/elasticsearch/data || true) &&
      (chmod -R 777 /usr/share/elasticsearch/data || true) &&
      /usr/local/bin/docker-entrypoint.sh eswrapper
      "
    restart: unless-stopped

networks:
  default:
    name: kl_desktop_network
    external: true