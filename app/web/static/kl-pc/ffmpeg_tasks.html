<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../file/js/kl-hammer.js" charset="UTF-8"></script>

    <title>转码任务</title>
    <style>
        #div_projects {
            width: 100%;
            float: left;
        }

        .task-list, attrs-input-div {
            width: 100%;
            float: left;
            margin-bottom: 100em;
        }

        .task-list > button {
            display: block;
            width: 90%;
            float: left;
            margin-top: 0.5em;
            text-align: left;
        }

        .attrs-input-div > label {
            float: left;
            margin-left: 2em;
        }

        .attrs-input-div > label > span {

        }

        .attrs-input-div > label > select {

        }

        .hidden {
            display: none !important;
        }

        .video_operation_div {
            position: fixed;
            top: 0;
            width: 100%;
            height: 100%;
            z-index: 998;
            background: rgba(0, 0, 0, 0.5);
        }

        .video_player_div {
            position: fixed;
            top: 0;
            left: 3em;
            width: 90%;
            height: calc(100vh - 25em);
            max-height: calc(100vh - 25em);
            z-index: 999;
            border: 1px solid #AA0;
            padding: 0.3em;
        }

        .video_player_div > video {
            max-width: 100%;
            max-height: 100%;

        }

        .item_on_fcous {
            border: 0.3em solid #666;
        }

        .task-item {
            width: 100%;
            float: left;
            border: 1px solid #F00;
            padding: 1em;

            .src {
                width: 30em;
                float: left;

                button {
                    display: block;
                    float: left;
                    width: 95%;
                }
            }

            .src-info {
                width: 8em;
                float: left;

                span, em {
                    display: block;
                    float: left;
                    font-size: 0.6em;
                    min-height: 1em;
                }

                .wh-rate-tv::before {
                    width: 1em;
                    content: '↔🖥️';
                }

                .wh-rate-phone::before {
                    width: 1em;
                    content: '↕📱';
                }

                .size {
                    width: 7em;
                }

                .file-size {
                    width: 5em;
                }

                .duration {
                    width: 4em;
                }


                .rate-k {
                    width: 3em;
                }
            }

            .compare-src-info {
                width: 25em;
                float: left;

                span, em {
                    display: block;
                    float: left;
                    font-size: 0.6em;
                    min-height: 1em;
                }

                .wh-rate-tv::before {
                    width: 1em;
                    content: '↔🖥️';
                }

                .wh-rate-phone::before {
                    width: 1em;
                    content: '↕📱';
                }

                .size {
                    width: 4em;
                }


                .fps {
                    width: 5em;
                }

                .rate-k {
                    width: 5em;
                }

                .ver {
                    width: 5em;
                }

            }

            .res {
                width: 45%;
                float: left;
            }

            .op {
                width: 20em;
                float: left;
            }

            .snapshots {
                width: 26em;
                float: left;
                max-height: 10em;

                canvas {
                    max-height: 8em;
                    max-width: 10em;
                }

                .header-ad, .tail-ad {
                    float: left;

                }
            }
        }

        .volume-input {
            appearance: slider-vertical;
            display: block;
            position: fixed;
            left: 0;
            height: calc(100vh - 5em);
            width: 1.5em;

        }

        .duration-input {

            width: 100%;


        }

        .play_btn {
            text-align: left;
        }

        .del-src-btn {
            text-align: left;
            width: 6em !important;
            background: #F00;
        }

        .rename-src-btn {
            text-align: left;
            width: 6em !important;
            background: #EEE;
        }

        .common-tool-bar {
            position: fixed;
            bottom: 0px;
            width: calc(100vw - 3em);
            left: 2em;
            background: #DDD;
            max-height: 25em;

            overflow: scroll;

            .stills {
                border: 1px solid #000;
                height: 300px;
                overflow-x: scroll;

                * {
                    display: block;
                    float: left;
                }

                .still {
                    padding: 1em;
                    max-height: 280px;
                    max-width: 200px;
                    border: 1px solid #000;

                    span {
                        margin-top: -1px;
                    }

                    img {
                        max-height: 280px;
                        max-width: 200px;
                    }
                }

                .empty-still {
                    max-height: 280px;
                    width: 100px;
                    border: 1px solid #000;

                    span {
                        margin-top: -1px;
                    }

                    img {
                        max-height: 280px;
                        max-width: 200px;
                    }
                }


                .header {
                    height: auto;
                    width: max-content;
                }

                .tail {
                    height: auto;
                    width: max-content;
                }
            }
        }

        .sec-input {
            width: 6em;
        }

        .fuck-type-video {
            background: #FEE;
        }

        .duration-info-p {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            width: 100%;
        }

        .duration-info-p, .duration-info-p > div {
            float: left;
        }

        .duration-info-p > div {
            width: 20em;
        }

        .duration-info-p > div > * {
            text-align: center;
        }

        .duration-info-p > div > canvas {
            max-width: 20em;
            max-height: 12em;
        }

        .duration-start-range {
            margin-top: 3em;
        }

        .duration-end-range {
            margin-top: 0em;

        }

        input[type="range"][dir="rtl"] {
            cursor: pointer;
            cursor: ew-resize; /* 左右调整光标 */
        }
    </style>
</head>
<body>
<div>
    <div>

    </div>
    <div id="root_div">
        <h2 id="wait-for-config">wait....</h2>
    </div>

</div>
<script></script>
<script>


    domLoaded(function () {
        let rootDiv = kl.id('root_div');

        let attrInputDiv = new Emt('div', 'class="attrs-input-div"');
        let queryBtn = kl.HTML.BUTTON_BUTTON('class="mark-ad-btn"', '查询');
        let fetchResBtn = kl.HTML.BUTTON_BUTTON('class="mark-ad-btn"', 'fetch res');


        let taskListDiv = new Emt('div', 'class="task-list"', {album2div: {}});

        let videoOperationDiv = new Emt('div', 'class="video_operation_div hidden"');
        let videoPlayerDiv = new Emt('div', 'class="video_player_div "');
        let playerControllerDiv = new Emt('div', 'class="video_player_ctrl_div "');
        let videoPlayer = new Emt('video', 'controls="controls"', '', {volume: 0.1});
        window.videoPlayer = videoPlayer;
        let volumeInput = new Emt('input', 'type="range" class="volume-input"', '', {max: 100, value: 5});
        let stillsDiv = new Emt('div', 'class="stills "');
        let headerStillsDiv = new Emt('div', 'class="header "');
        let tailStillsDiv = new Emt('div', 'class="tail"');


        let headerAdSecondsRange = new Emt('input', 'type="range" class="duration-input duration-start-range"', '', {max: 1000, value: 0, step: 1});
        let tailAdSecondsRange = new Emt('input', 'type="range" dir="rtl" class="duration-input duration-end-range"', '', {
            max: 1000,
            value: 1000,
            step: 1
        });
        let rubishAdDurationSizeInput = kl.HTML.SELECT('class="mark-ad-select"').setItems([
            {val: 100, text: 100},
            {val: 250, text: 250},
            {val: 500, text: 500},
            {val: 1000, text: 1000},
            {val: 3600, text: 3600},
            {val: 7200, text: 7200},
            {val: 10800, text: 10800},


        ]).setPros({value: 250});

        let durationStartImg = kl.HTML.CANVAS('class="start-img"');
        let durationEndImg = kl.HTML.CANVAS('class="end-img"');

        const durationStartCtx = durationStartImg.getContext('2d');

        const durationEndCtx = durationEndImg.getContext('2d');


        let durationStartSecInput = kl.HTML.INPUT_NUMBER('class="duration-start-val"');
        let durationEndSecInput = kl.HTML.INPUT_NUMBER('class="duration-end-val"');

        let durationCurrentSecInput = kl.HTML.INPUT_NUMBER('class="duration-start-val" max="100000" style="width:7em;"');
        let durationLeftSecInput = kl.HTML.INPUT_NUMBER('class="duration-end-val" max="100000" style="width:7em;"');


        let opConfig = {};

        let ajaxHooks = {
            id: {isSend: true, data: {}},
        };

        let taskGears = [
            {height: 720, maxRateK: 1600, fps: 24, title: '骑兵/标准'},
            {height: 720, maxRateK: 2000, fps: 24, title: '720 2000k 24fps'},
            {height: 720, maxRateK: 2400, fps: 30, title: '720高帧',},
            {height: 720, maxRateK: 2400, fps: 24, title: '高清720',},
            {height: 720, maxRateK: 3000, fps: 30, title: '超清清720 30fps',},
            {height: 720, maxRateK: 3000, fps: 24, title: '超清清720 24fps',},
            {height: 1080, maxRateK: 1600, fps: 24, title: '骑兵/标准/低质手机'},
            {height: 1080, maxRateK: 2000, fps: 24, title: '1080P 2M 24fps'},
            {height: 1080, maxRateK: 2400, fps: 24, title: '普通步兵1080',},
            {height: 1080, maxRateK: 3000, fps: 30, title: '顶级步兵1080',},
        ];
        let taskGearStrVal2ObjectVal = {};


        let attrsKV = {
            is_err: {text: '出错了?', val: {1: '出错了', 2: '正常'}},
            is_pre: {text: '得多转一次?', val: {1: '不能直接转码', 2: '可以直接转码'}},
            is_src_exist: {text: '原始文件还在', val: {1: '还在', 2: '已经删除'}},
            is_auto_del_src: {text: '自动删除', val: {1: '自动删除', 2: '需要审核后才能删除'}},
            is_ok: {text: '转码完成?', val: {1: '转码好了', 2: '没能转码结束'}, default: 2},
            run_lc: {text: '运行锁?', val: {0: 'free', '>0': '被锁了'}},
            album_dir: {text: 'album', val: 'string'},
            video_title: {text: 'video name', val: 'string'},
            hr1: kl.HTML.HR('style="height:1em;"').setPros({isTextEle: true}),
            sortAttr1: {text: 'sort1', val: {album_dir: 'album_dir', video_title: 'video_title',run_lc:'run_lc',id:'id',update_date:'update_date'},default:'album_dir'},
            sortType1: {text: ':', val: {'asc': 'asc', 'desc': 'desc'},default:'asc'},

            sortAttr2: {text: 'sort2', val: {album_dir: 'album_dir', video_title: 'video_title',run_lc:'run_lc',id:'id',update_date:'update_date'},default:'video_title'},
            sortType2: {text: ':', val: {'asc': 'asc', 'desc': 'desc'},default:'asc'},
            sortAttr3: {text: 'sort3', val: {album_dir: 'album_dir', video_title: 'video_title',run_lc:'run_lc',id:'id',update_date:'update_date'},default:'run_lc'},
            sortType3: {text: ':', val: {'asc': 'asc', 'desc': 'desc'},default:'asc'},

            limit: {text: 'limit', val: 100, default: 100,},
            listSrcFile: {text: '扫描src文件', val: {yes:'扫描src', no: '不需要'},default:'yes'},

        };
        let attrInputKV = {};
        let attrInputs = [];
        for (const [attr, cfg] of Object.entries(attrsKV)) {
            if (cfg.isTextEle === true) {
                attrInputs.push(cfg);
                continue;
            }
            cfg.attr = attr;
            let items = [{text: '#', val: '#'}];
            let input;
            let valType = (typeof cfg.val);
            switch (valType) {
                case 'object':
                    for (const [k, v] of Object.entries(cfg.val)) {
                        items.push({text: v, val: k});
                    }
                    input = kl.HTML.SELECT().setItems(items);
                    break;

                case "number":
                    input = kl.HTML.INPUT_NUMBER().setPros({max: cfg.val});
                    break;
                case 'string':
                default:
                    input = kl.HTML.INPUT_TEXT();
                    break;

            }

            attrInputKV[attr] = input;
            input.label = cfg.text;
            input.attrKey = attr;
            if (cfg.default === undefined) {
                input.val = '#';
            } else {
                input.value = cfg.default;
            }
            input.isTextEle = false;

            attrInputs.push(input);
        }


        let timeBtns = [
            kl.HTML.BUTTON_BUTTON('class="mark-ad-btn"', '', {num: 60}),
            kl.HTML.BUTTON_BUTTON('class="mark-ad-btn"', '', {num: 10}),
            kl.HTML.BUTTON_BUTTON('class="mark-ad-btn"', '', {num: 1}),

            kl.HTML.BUTTON_BUTTON('class="mark-ad-btn"', '', {num: -60}),
            kl.HTML.BUTTON_BUTTON('class="mark-ad-btn"', '', {num: -10}),
            kl.HTML.BUTTON_BUTTON('class="mark-ad-btn"', '', {num: -1}),

        ];
        timeBtns.forEach(timeBtn => {
            let typeStr = timeBtn.num > 0 ? '>>>' : '<<<';
            let num = Math.abs(timeBtn.num);
            timeBtn.textContent = `${typeStr}${num}`;
            timeBtn.addEventListener('click', () => {
                let baseSec = parseInt(videoPlayer.currentTime);
                videoPlayer.currentTime = baseSec + timeBtn.num;
            });
        })
        rootDiv.addNodes([
            videoOperationDiv.addNodes([
                videoPlayerDiv.addNodes([
                    playerControllerDiv,
                    videoPlayer,
                ]),
                kl.HTML.DIV(`class="common-tool-bar"`,).addNodes([
                    stillsDiv.addNode(
                        headerStillsDiv,
                        tailStillsDiv,
                    ),
                    kl.HTML.DIV().addNode([
                        headerAdSecondsRange,
                        kl.HTML.PARAGRAPH('class="duration-info-p"').addNodes([
                            kl.HTML.DIV('class="duration-start-info"').addNodes([
                                durationStartImg,
                                durationStartSecInput
                            ]),
                            kl.HTML.DIV('class="duration-ad-size"').addNodes([
                                kl.HTML.PARAGRAPH().addNodes([
                                    kl.HTML.SPAN('', '垃圾广告时间范围:'), rubishAdDurationSizeInput
                                ]),
                                kl.HTML.PARAGRAPH().addNodes([
                                    kl.HTML.SPAN('', '当前:').addNodes([durationCurrentSecInput]),

                                    kl.HTML.SPAN('', '还剩:').addNodes([durationLeftSecInput,
                                    ]),
                                ]),


                            ]),
                            kl.HTML.DIV('class="duration-end-info"').addNodes([
                                durationEndImg,
                                durationEndSecInput
                            ]),
                        ]),
                        //durationInput,
                        tailAdSecondsRange,
                        kl.HTML.SPAN().addNodes(timeBtns.slice(3)),
                        kl.HTML.SPAN().addNodes(timeBtns.slice(0, 3)),
                    ])
                ]),
            ]),


            attrInputDiv.addNodes(attrInputs.map(input => {
                if (input.isTextEle === true) {
                    return input;
                }
                return kl.HTML.LABEL().addNodes([
                    kl.HTML.SPAN('', input.label),
                    input,
                ])
            })).addNodes([queryBtn, fetchResBtn]),
            taskListDiv,


        ]);
        document.body.append(volumeInput);

        let getVdieoSrc = (src) => {
            return `http://kl-home-pc:8001${src}`;
        }
        let functionPlay = (item) => {

            durationEndSecInput.value = 0;
            durationStartSecInput.value = 0;

            durationStartCtx.clearRect(0, 0, durationStartImg.width, durationStartImg.height);

            durationEndCtx.clearRect(0, 0, durationEndImg.width, durationEndImg.height);


            window.currItem = item;
            videoOperationDiv.classList.remove('hidden');
            videoPlayer.volume = parseInt(volumeInput.value) / 100;
            videoPlayer.src = getVdieoSrc(item.src);

            console.log(videoPlayer);

            videoPlayer.addEventListener('loadedmetadata', function captureFrame1() {
                videoPlayer.removeEventListener('loadedmetadata', captureFrame1);
                console.log('loadedmetadata:', videoPlayer.duration);
                if (item.durationSec === 0) {
                    item.durationSec = parseInt(videoPlayer.duration);
                }
            });

            videoPlayer.play();
        }


        let makeGearVal = (gear) => {

            // gear.val = `${gear.height}_${gear.maxRateK}_${gear.fps}_${gear.csf}_${gear.title}_${gear.resAs}`;
            return `${gear.height}_${gear.maxRateK}_${gear.fps}_${gear.csf}_${gear.isCopy}_${gear.resAs}_${gear.resVer}`;
        }
        let makeDstTaskSelect = (videoInfo) => {
            let autoGear = videoInfo.task_info.expect;
            if (autoGear) {
                autoGear.resAs = autoGear.resAs || 'h265';

                if (autoGear.maxRateK) {
                    let ar = [];
                    autoGear.maxRateK = parseInt(autoGear.maxRateK.replace('k', ''));
                    ar.push('auto'.padStart(30));

                    ar.push(autoGear.height.toString().padStart(6));
                    ar.push(autoGear.maxRateK.toString().padStart(6));
                    ar.push(autoGear.fps.toString().padStart(6));
                    ar.push(autoGear.resAs.toString().padStart(6));
                    autoGear.text = ar.join('');
                    autoGear.val = makeGearVal(autoGear);
                    console.log({videoInfo: videoInfo, autoGear: autoGear});
                }
            } else {
                console.error({videoInfo: videoInfo, autoGear: autoGear, taskGears: taskGears});
            }
            let select = kl.HTML.SELECT();
            if (autoGear === undefined) {
                console.error('autoGear undefined');
                select.setItems(taskGears);
                select.value = Object.values(taskGears)[0].val;
            } else {
                if (taskGearStrVal2ObjectVal[autoGear.val] === undefined) {
                    console.warn({
                        taskGearStrVal2ObjectVal: taskGearStrVal2ObjectVal,
                        taskSelect: autoGear.val,
                        autoGear: autoGear,
                        videoInfo: videoInfo,
                    });
                    select.setItems(taskGears.concat([autoGear]));
                } else {
                    select.setItems(taskGears);
                }

                select.value = autoGear.val;
            }

            return select;

        };

        let getQueryAttrs = () => {
            let attrs = {};
            attrInputs.forEach(input => {

                if (input.isTextEle === false && input.value !== '#' && input.value !== '') {
                    attrs[input.attrKey] = input.value;
                }
            });
            return attrs;
        };
        let query = () => {
            taskListDiv.album2div = {};
            taskListDiv.removeAllChildNodes();
            queryBtn.classList.add('hide');
            kl.ajax({
                url: '/dev/v1/KL_PC/xx/op/task/list',
                data: {file: '/data/sysadv.debug', attrs: getQueryAttrs(), kldebug: 'x'},
                success: function (file_result) {
                    queryBtn.classList.remove('hide');

                    console.log(file_result);
                    let srcVideoInfoKV = kl.getValByPath(file_result, 'data.srcVideoInfoKV');
                    if(opConfig.srcVideoInfoKV===undefined){
                        opConfig.srcVideoInfoKV={};
                    }
                    opConfig.srcVideoInfoKV = Object.assign(opConfig.srcVideoInfoKV, srcVideoInfoKV);
                    let list = kl.getValByPath(file_result, 'data.list');
                    if (list && Array.isArray(list)) {
                        console.log(file_result);
                        list.forEach((videoInfo, i) => {
                            if (videoInfo.is_pre === 1) {
                                // return false;
                            }

                            if (opConfig.srcVideoInfoKV[videoInfo.id36]) {
                                let srcInfo = opConfig.srcVideoInfoKV[videoInfo.id36];
                                videoInfo.src = srcInfo.fullFilename;
                                videoInfo.filesize = srcInfo.filesize;
                            }
                            let sizeM = parseInt(videoInfo.filesize / 1024 / 1024);
                            let srcInfo = videoInfo.src_video_info;
                            let taskManualInfo = kl.getValByPath(videoInfo, 'task_info.manual', {});
                            let srcTitle = `${videoInfo.id}/${videoInfo.id36} ${videoInfo.video_title}.${videoInfo.video_ext} `;
                            let infospan = new Emt('span', '', '', {textContent: ''});

                            let taskSelect = makeDstTaskSelect(videoInfo);
                            let transposeSelect = kl.HTML.SELECT('').setItems([{text: '方向不变', val: ''}, {
                                text: '⬆️↻顺时针90度⬇️',
                                val: 'transpose=1'
                            }, {text: '️⬇️逆时针90度↺⬆️', val: 'transpose=2'}]);
                            if (taskManualInfo?.ext?.transpose) {
                                transposeSelect.value = taskManualInfo.ext.transpose;
                            }

                            let isPreSelect = kl.HTML.SELECT('').setItems([{text: '不需要pre转码', val: '2'}, {
                                text: '需要pree转化️',
                                val: '1'
                            }]);
                            if (videoInfo.is_pre) {
                                isPreSelect.value = videoInfo.is_pre;
                            }

                            let srcBtnsDiv = new Emt('div', 'class="src src-btns"');
                            let srcInfoDiv = new Emt('div', 'class="src-info"');
                            let compareSrcInfoDiv = new Emt('div', 'class="compare-src-info"');
                            let dstManualInfoDiv = new Emt('div', 'class="compare-src-info"');
                            let resDiv = new Emt('div', 'class="res-info"');

                            let snapshotDiv = new Emt('div', 'class="snapshots"');

                            let headerAdCanvas = new Emt('canvas');
                            let tailAdCanvas = new Emt('canvas');
                            let headerAdSecondsInput = kl.HTML.INPUT_NUMBER('', '', {value: taskManualInfo.ss || 0});
                            let tailAdSecondsInput = kl.HTML.INPUT_NUMBER('', '', {value: taskManualInfo.tailAdSeconds || 0});

                            videoInfo.headerAdCanvas = headerAdCanvas;
                            videoInfo.tailAdCanvas = tailAdCanvas;
                            videoInfo.headerAdSecondsInput = headerAdSecondsInput;
                            videoInfo.tailAdSecondsInput = tailAdSecondsInput;
                            videoInfo.durationSec = 0;


                            let opBtn = new Emt('button', 'type="button" class="hidden"', '应用');
                            let spreadAdRangeBtn = new Emt('button', 'type="button" class=""', '同步垃圾广告');


                            let opDiv = new Emt('div', 'class="op"');

                            let whRate = parseInt(srcInfo.width * 100 / srcInfo.height);
                            let whFlag = whRate >= 100 ? 'tv' : 'phone';
                            let taskDiv = new Emt('div', 'class="task-item"', '', {taskInfo: videoInfo}).addNodeKV({
                                srcBtnsDiv: srcBtnsDiv,
                                srcInfoDiv: srcInfoDiv.addNodes([
                                    //  kl.HTML.EM('class="try-times"', `${videoInfo.try_times}`),
                                    kl.HTML.EM('class="file-size"', `${sizeM}M`),
                                    kl.HTML.EM('class="duration"', `${srcInfo.duration}s`),
                                ]),
                                opDiv: opDiv.addNodes([
                                    compareSrcInfoDiv.addNodes([
                                        `<span class="wh-rate-${whFlag}"></span>
                                        <span class="size">${srcInfo.width}x</span>
                                        <span class="size">${srcInfo.height}</span>
                                        <span class="rate-k">${srcInfo.rateK}K</span>
                                        <span class="fps">${srcInfo.fps}fps</span>`,
                                        `<span class="ver">${videoInfo.try_times || '0'}</span>`,

                                    ]),
                                    dstManualInfoDiv.addNodes([
                                        `<span class="wh-rate-${whFlag}"></span>`,
                                        '<span class="size">widthx</span>',
                                        `<span class="size">${taskManualInfo.height || ''}</span>`,
                                        `<span class="rate-k">${taskManualInfo.maxRateK || ''}</span>`,
                                        `<span class="fps">${taskManualInfo.fps || ''}fps</span>`,
                                        `<span class="ver">${taskManualInfo.resVer || ''}</span>`,
                                    ]),
                                    taskSelect, transposeSelect, isPreSelect, infospan, opBtn
                                ]),
                                snapshotDiv: snapshotDiv.addNodes([
                                    kl.HTML.DIV('class="header-ad"').addNodes([
                                        headerAdCanvas,
                                        kl.HTML.HR(),
                                        headerAdSecondsInput,

                                                resolve(video);

                                            }

                                            const onLoaded = () => {
                                                video.removeEventListener('loadedmetadata', onLoaded);
                                                video.removeEventListener('error', onError);
                                                resolve(video);
                                            };

                                            const onError = (e) => {
                                                video.removeEventListener('loadedmetadata', onLoaded);
                                                video.removeEventListener('error', onError);
                                                reject(e);
                                            };

                                            video.addEventListener('loadedmetadata', onLoaded);
                                            video.addEventListener('error', onError);

                                            // 超时处理
                                            setTimeout(() => {
                                                video.removeEventListener('loadedmetadata', onLoaded);
                                                video.removeEventListener('error', onError);
                                                reject(new Error('视频元数据加载超时'));
                                            }, 10000);

                                                video.removeEventListener('seeked', onSeeked);
                                                video.removeEventListener('error', onSeekError);

                                                try {

                                                    canvas.height = video.videoHeight;
                                                    const ctx = canvas.getContext('2d');

                                                video.removeEventListener('error', onSeekError);

                                            };

                                            video.addEventListener('seeked', onSeeked);
                                            video.addEventListener('error', onSeekError);

                                            // 超时处理
                                            setTimeout(() => {
                                                video.removeEventListener('seeked', onSeeked);
                                                video.removeEventListener('error', onSeekError);
                                                reject(new Error('视频跳转超时'));
                                            }, 5000);

                    opConfig.tailTsList = opConfig.tailTs.sort((a, b) => {
                        return b - a;
                    });
                    opConfig.sec2stillImg = {};

                    opConfig.headerTsList.forEach(sec => {
                        let imgDiv = kl.HTML.DIV('class="still"', '', {sec: sec, ttype: 'header'});
                        let img = kl.HTML.IMAGE('', '', {sec: sec, ttype: 'header'});
                        headerStillsDiv.addNode(
                            imgDiv.addNode(
                                img,
                                `<span>h${sec}</span>`
                            )
                        );
                        img.addEventListener('load', () => {
                            imgDiv.classList.remove('empty-still');
                        });
                        img.addEventListener('error', () => {
                            imgDiv.classList.add('empty-still');
                        });
                        opConfig.sec2stillImg[`start_${sec}`] = img;
                    });
                    opConfig.tailTsList.forEach(sec => {
                        let imgDiv = kl.HTML.DIV('class="still"', '', {sec: sec, ttype: 'tail'});
                        let img = kl.HTML.IMAGE('', '', {sec: sec, ttype: 'tail'});
                        tailStillsDiv.addNode(
                            imgDiv.addNode(
                                `<span>t${sec}</span>`,
                                img
                            )
                        );
                        img.addEventListener('load', () => {
                            imgDiv.classList.remove('empty-still');
                        });
                        img.addEventListener('error', () => {
                            imgDiv.classList.add('empty-still');
                        });
                        opConfig.sec2stillImg[`tail_${sec}`] = img;
                    });

                    opConfig.loadStill = (id36) => {
                        for (const [key, img] of Object.entries(opConfig.sec2stillImg)) {
                            img.src = `http://kl-home-pc:8001/mnt/f/tmp2/format/wait/FFOutput_stills/${id36}/${key}.jpg`;
                        }
                    };


                    query();
                } else {
                    let err_msg = kl.getValByPath(cfg_res, 'msg', '未知错误');
                    alert(err_msg);
                    throw err_msg;
                }
            },
            error: (error) => {
                window.clearInterval(waitSi);
                waitMsg.textContent += ` error`;
                console.error(error);
            }
        });

    })

</script>
