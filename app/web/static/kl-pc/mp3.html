<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 音乐播放器</title>
    <style>
        /* ===== 全局重置 & 变量 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #0f0e1a;
            --card: #1a1833;
            --card-hover: #25224a;
            --primary: #7c6cf0;
            --primary-glow: rgba(124, 108, 240, 0.35);
            --text: #f0ecff;
            --text-secondary: #a8a2c9;
            --border: #2d2a50;
            --shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
            --radius: 16px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        html,
        body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9a8af5;
        }

        /* ===== 主容器 ===== */
        .player {
            width: 100%;
            max-width: 820px;
            max-height: 96vh;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 28px 32px 24px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border);
            backdrop-filter: blur(2px);
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), #b8aaff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header h1 span {
            -webkit-text-fill-color: var(--text-secondary);
            font-size: 14px;
            font-weight: 400;
            background: none;
            opacity: 0.7;
        }
        .status-badge {
            font-size: 12px;
            background: var(--border);
            padding: 4px 14px;
            border-radius: 20px;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
        }

        /* ===== 当前歌曲信息 ===== */
        .now-playing {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            flex-shrink: 0;
            min-height: 32px;
        }
        .now-playing .icon {
            font-size: 20px;
            opacity: 0.6;
        }
        .now-playing .name {
            font-size: 18px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text);
        }
        .now-playing .name.empty {
            color: var(--text-secondary);
            font-weight: 400;
            font-size: 15px;
        }

        /* ===== 进度条 ===== */
        .progress-area {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
            margin-bottom: 12px;
        }
        .progress-area .time {
            font-size: 13px;
            font-variant-numeric: tabular-nums;
            color: var(--text-secondary);
            min-width: 48px;
            letter-spacing: 0.3px;
        }
        .progress-area .time.right {
            text-align: right;
        }
        .progress-track {
            flex: 1;
            position: relative;
            height: 6px;
            background: var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: height 0.15s;
        }
        .progress-track:hover {
            height: 8px;
        }
        .progress-track .fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #b8aaff);
            border-radius: 10px;
            pointer-events: none;
            transition: width 0.05s linear;
            position: relative;
        }
        .progress-track .fill::after {
            content: '';
            position: absolute;
            right: -5px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 16px var(--primary-glow);
            opacity: 0;
            transition: opacity 0.2s;
        }
        .progress-track:hover .fill::after {
            opacity: 1;
        }
        .progress-track input[type="range"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            margin: 0;
            z-index: 2;
        }

        /* ===== 控制按钮 & 音量 ===== */
        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .controls .btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            background: var(--border);
            flex-shrink: 0;
        }
        .controls .btn:hover {
            background: var(--primary);
            color: #fff;
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .controls .btn:active {
            transform: scale(0.92);
        }
        .controls .btn-play {
            width: 52px;
            height: 52px;
            font-size: 26px;
            background: var(--primary);
            color: #fff;
            box-shadow: 0 0 24px var(--primary-glow);
        }
        .controls .btn-play:hover {
            background: #8f7ff5;
            box-shadow: 0 0 36px var(--primary-glow);
            transform: scale(1.04);
        }
        .controls .btn-play.paused {
            background: var(--border);
            color: var(--text-secondary);
            box-shadow: none;
        }
        .controls .btn-play.paused:hover {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 0 24px var(--primary-glow);
        }
        .controls .spacer {
            flex: 1;
        }
        .controls .badge-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--border);
            padding: 4px 12px 4px 10px;
            border-radius: 20px;
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
            flex-shrink: 0;
        }
        .controls .badge-group:hover {
            background: var(--card-hover);
            color: var(--text);
        }
        .controls .badge-group .label {
            opacity: 0.7;
        }
        .controls .badge-group .value {
            font-weight: 600;
            color: var(--primary);
        }

        /* 音量控制 */
        .volume-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--border);
            padding: 2px 12px 2px 8px;
            border-radius: 20px;
            flex-shrink: 0;
            height: 34px;
        }
        .volume-wrap .vol-icon {
            font-size: 16px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            line-height: 1;
            user-select: none;
        }
        .volume-wrap .vol-icon:hover {
            color: var(--text);
        }
        .volume-wrap input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 60px;
            height: 4px;
            background: var(--text-secondary);
            border-radius: 4px;
            outline: none;
            transition: background 0.2s;
            cursor: pointer;
        }
        .volume-wrap input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            box-shadow: 0 0 8px var(--primary-glow);
        }
        .volume-wrap input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            border: none;
        }

        /* ===== 歌词区域 ===== */
        .lyrics-wrap {
            flex: 1;
            min-height: 120px;
            max-height: 200px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow-y: auto;
            padding: 14px 16px;
            margin-bottom: 16px;
            position: relative;
            transition: border-color 0.3s;
            scroll-behavior: smooth;
        }
        .lyrics-wrap:empty::before {
            content: '🎶 暂无歌词';
            color: var(--text-secondary);
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            opacity: 0.5;
        }
        .lyrics-wrap .lrc-line {
            font-size: 15px;
            line-height: 1.9;
            padding: 2px 8px;
            border-radius: 6px;
            color: var(--text-secondary);
            transition: all 0.2s;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .lyrics-wrap .lrc-line.active {
            color: #fff;
            font-weight: 600;
            background: var(--primary-glow);
            box-shadow: 0 0 20px rgba(124, 108, 240, 0.08);
            transform: scale(1.02);
        }
        .lyrics-wrap .lrc-line:not(.active):hover {
            background: rgba(255, 255, 255, 0.04);
        }

        /* ===== 列表区域 ===== */
        .list-area {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            max-height: 260px;
            border-top: 1px solid var(--border);
            padding-top: 14px;
        }
        .list-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            flex-shrink: 0;
            gap: 10px;
            flex-wrap: wrap;
        }
        .list-header .count {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .list-header .count strong {
            color: var(--text);
        }
        .list-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .list-actions .action-btn {
            background: var(--border);
            border: none;
            color: var(--text-secondary);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .list-actions .action-btn:hover {
            background: var(--card-hover);
            color: var(--text);
        }
        .list-actions .action-btn.active {
            background: var(--primary);
            color: #fff;
        }

        .song-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }
        .song-list .song-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-secondary);
            border-left: 3px solid transparent;
        }
        .song-list .song-item:hover {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
        }
        .song-list .song-item.active {
            background: var(--primary-glow);
            color: #fff;
            border-left-color: var(--primary);
            font-weight: 500;
        }
        .song-list .song-item .index {
            font-size: 12px;
            opacity: 0.4;
            min-width: 24px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .song-list .song-item .name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .song-list .song-item .play-indicator {
            font-size: 14px;
            opacity: 0;
            transition: var(--transition);
        }
        .song-list .song-item.active .play-indicator {
            opacity: 1;
        }
        .song-list .song-item .duration {
            font-size: 12px;
            opacity: 0.5;
            font-variant-numeric: tabular-nums;
        }

        /* ===== loading ===== */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 0;
            color: var(--text-secondary);
            gap: 10px;
            font-size: 14px;
        }
        .loading .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 30px 0;
            color: var(--text-secondary);
            opacity: 0.5;
            font-size: 14px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 640px) {
            body {
                padding: 10px;
            }
            .player {
                padding: 18px 16px 16px;
                max-height: 98vh;
                border-radius: 12px;
            }
            .header h1 {
                font-size: 18px;
            }
            .header h1 span {
                font-size: 12px;
            }
            .now-playing .name {
                font-size: 15px;
            }
            .controls .btn {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
            .controls .btn-play {
                width: 46px;
                height: 46px;
                font-size: 22px;
            }
            .volume-wrap input[type="range"] {
                width: 40px;
            }
            .lyrics-wrap {
                min-height: 80px;
                max-height: 140px;
                padding: 10px 12px;
            }
            .lyrics-wrap .lrc-line {
                font-size: 13px;
                line-height: 1.7;
            }
            .list-area {
                max-height: 180px;
            }
            .song-list .song-item {
                padding: 6px 10px;
                font-size: 13px;
            }
            .progress-area .time {
                font-size: 11px;
                min-width: 38px;
            }
            .controls .badge-group {
                font-size: 11px;
                padding: 2px 10px;
            }
            .list-actions .action-btn {
                font-size: 11px;
                padding: 3px 10px;
            }
            .volume-wrap {
                padding: 2px 8px 2px 6px;
                height: 30px;
            }
            .volume-wrap input[type="range"] {
                width: 36px;
            }
        }
        @media (max-width: 450px) {
            .controls {
                gap: 6px;
            }
            .controls .btn {
                width: 32px;
                height: 32px;
                font-size: 14px;
            }
            .controls .btn-play {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
            .list-header {
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
            }
            .list-actions {
                flex-wrap: wrap;
            }
            .volume-wrap input[type="range"] {
                width: 30px;
            }
        }
    </style>
</head>
<body>

<div class="player" id="app">
    <!-- 头部 -->
    <div class="header">
        <h1>🎵 音乐 <span>· 播放器</span></h1>
        <div class="status-badge" id="statusBadge">● 就绪</div>
    </div>

    <!-- 当前歌曲 -->
    <div class="now-playing">
        <span class="icon">♫</span>
        <span class="name empty" id="currentSongName">选择一首歌开始聆听</span>
    </div>

    <!-- 进度条 -->
    <div class="progress-area">
        <span class="time" id="currentTime">00:00</span>
        <div class="progress-track" id="progressTrack">
            <div class="fill" id="progressFill" style="width:0%"></div>
            <input type="range" id="progressRange" min="0" max="100" value="0" step="0.01">
        </div>
        <span class="time right" id="totalTime">00:00</span>
    </div>

    <!-- 控制按钮 + 音量 -->
    <div class="controls">
        <button class="btn" id="prevBtn" title="上一首">⏮</button>
        <button class="btn btn-play paused" id="playBtn" title="播放 / 暂停">▶</button>
        <button class="btn" id="nextBtn" title="下一首">⏭</button>
        <span class="spacer"></span>
        <div class="badge-group" id="modeToggle" title="切换播放模式">
            <span class="label">模式</span>
            <span class="value" id="modeLabel">顺序</span>
        </div>
        <div class="badge-group" id="sortToggle" title="切换排序">
            <span class="label">排序</span>
            <span class="value" id="sortLabel">▲ 正序</span>
        </div>
        <!-- 音量控制 -->
        <div class="volume-wrap" id="volumeWrap">
            <span class="vol-icon" id="volIcon" title="静音切换">🔊</span>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
        </div>
    </div>

    <!-- 歌词 -->
    <div class="lyrics-wrap" id="lyricsContainer"></div>

    <!-- 列表 -->
    <div class="list-area">
        <div class="list-header">
            <span class="count">共 <strong id="songCount">0</strong> 首</span>
            <div class="list-actions">
                <button class="action-btn active" id="sortAscBtn" data-sort="asc">▲ 正序</button>
                <button class="action-btn" id="sortDescBtn" data-sort="desc">▼ 倒序</button>
            </div>
        </div>
        <div class="song-list" id="songList"></div>
    </div>
</div>

<script>
    (function() {
        'use strict';

        // ================================================================
        //  配置
        // ================================================================
        const API_URL = 'http://kl-home-pc:8002/dev/v1/KL_PC/GetMusicList';
        const LRC_API_URL = 'http://kl-home-pc:8002/dev/v1/KL_PC/music/getLrc';
        const MP3_BASE = 'http://kl-home-pc:8001/mnt/f/music/mp3/';

        // ================================================================
        //  DOM 引用
        // ================================================================
        const $ = id => document.getElementById(id);
        const currentSongName = $('currentSongName');
        const progressFill = $('progressFill');
        const progressRange = $('progressRange');
        const currentTimeEl = $('currentTime');
        const totalTimeEl = $('totalTime');
        const playBtn = $('playBtn');
        const prevBtn = $('prevBtn');
        const nextBtn = $('nextBtn');
        const lyricsContainer = $('lyricsContainer');
        const songList = $('songList');
        const songCount = $('songCount');
        const sortAscBtn = $('sortAscBtn');
        const sortDescBtn = $('sortDescBtn');
        const modeToggle = $('modeToggle');
        const modeLabel = $('modeLabel');
        const statusBadge = $('statusBadge');
        const progressTrack = $('progressTrack');
        const volumeSlider = $('volumeSlider');
        const volIcon = $('volIcon');

        // ================================================================
        //  状态
        // ================================================================
        let musicData = []; // 原始数据 [{songName, urlStr}]
        let displayList = []; // 当前显示（排序后）
        let currentIndex = -1; // 在 displayList 中的索引
        let isPlaying = false;
        let isDragging = false;
        let playMode = 'sequential'; // 'sequential' | 'random'
        let sortOrder = 'asc'; // 'asc' | 'desc'

        const audio = new Audio();
        let lyricsData = []; // [{time: 秒, text: '歌词'}]
        let lyricsLoaded = false;

        // ================================================================
        //  工具函数
        // ================================================================
        function formatTime(seconds) {
            if (!seconds || isNaN(seconds) || seconds < 0) return '00:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
        }

        function getMp3Url(urlStr) {
            return MP3_BASE + urlStr + '.mp3';
        }

        function getSongName(item) {
            return item.songName || '未命名歌曲';
        }

        // ================================================================
        //  歌词解析
        // ================================================================
        function parseLrc(text) {
            const lines = text.split(/\r?\n/);
            const result = [];
            const timeRegex = /\[(\d{2}):(\d{2})(?:\.(\d{2}))?\]/g;

            for (const raw of lines) {
                const line = raw.trim();
                if (!line) continue;
                const regex = new RegExp(timeRegex.source, 'g');
                let match;
                const times = [];
                let textPart = line;
                while ((match = regex.exec(line)) !== null) {
                    const min = parseInt(match[1], 10);
                    const sec = parseInt(match[2], 10);
                    const cent = match[3] ? parseInt(match[3], 10) : 0;
                    const totalSec = min * 60 + sec + cent / 100;
                    times.push(totalSec);
                }
                if (times.length > 0) {
                    let pureText = line.replace(/\[\d{2}:\d{2}(?:\.\d{2})?\]/g, '').trim();
                    if (!pureText) continue;
                    for (const t of times) {
                        result.push({ time: t, text: pureText });
                    }
                } else {
                    continue;
                }
            }
            result.sort((a, b) => a.time - b.time);
            return result;
        }

        // ================================================================
        //  加载歌词 (新接口)
        // ================================================================
        async function loadLyrics(songName) {
            lyricsData = [];
            lyricsLoaded = false;
            lyricsContainer.innerHTML = '';
            if (!songName) {
                lyricsContainer.innerHTML =
                    '<div style="text-align:center;color:var(--text-secondary);opacity:0.4;padding:20px 0;">📄 歌曲名无效</div>';
                return;
            }
            const url = `${LRC_API_URL}?songName=${encodeURIComponent(songName)}`;
            try {
                const resp = await fetch(url);
                if (!resp.ok) throw new Error('歌词加载失败 HTTP ' + resp.status);
                // 尝试获取文本，可能是纯文本或 JSON
                const contentType = resp.headers.get('content-type') || '';
                let text;
                if (contentType.includes('json')) {
                    const json = await resp.json();
                    // 假设数据结构为 { data: 'lrc内容' } 或 { lrc: '...' }
                    text = json.data || json.lrc || json.content || JSON.stringify(json);
                } else {
                    text = await resp.text();
                }
                // 如果返回的是 JSON 字符串但未正确识别，尝试解析
                if (typeof text === 'string' && text.trim().startsWith('{')) {
                    try {
                        const parsed = JSON.parse(text);
                        text = parsed.data || parsed.lrc || parsed.content || text;
                    } catch (_) { /* 保留原文本 */ }
                }
                const parsed = parseLrc(text);
                if (parsed.length === 0) {
                    lyricsContainer.innerHTML =
                        '<div style="text-align:center;color:var(--text-secondary);opacity:0.4;padding:20px 0;">📄 暂无歌词</div>';
                    return;
                }
                lyricsData = parsed;
                lyricsLoaded = true;
                renderLyrics(0);
            } catch (err) {
                console.warn('歌词加载失败:', err.message);
                lyricsContainer.innerHTML =
                    '<div style="text-align:center;color:var(--text-secondary);opacity:0.4;padding:20px 0;">📄 歌词加载失败</div>';
            }
        }

        // ================================================================
        //  渲染歌词
        // ================================================================
        function renderLyrics(currentTime) {
            if (!lyricsLoaded || lyricsData.length === 0) {
                if (lyricsContainer.children.length === 0) {
                    lyricsContainer.innerHTML =
                        '<div style="text-align:center;color:var(--text-secondary);opacity:0.4;padding:20px 0;">🎶 暂无歌词</div>';
                }
                return;
            }

            let activeIndex = -1;
            for (let i = 0; i < lyricsData.length; i++) {
                if (lyricsData[i].time <= currentTime) {
                    activeIndex = i;
                } else {
                    break;
                }
            }

            let html = '';
            for (let i = 0; i < lyricsData.length; i++) {
                const cls = (i === activeIndex) ? 'lrc-line active' : 'lrc-line';
                html += `<div class="${cls}" data-index="${i}">${escapeHtml(lyricsData[i].text)}</div>`;
            }
            lyricsContainer.innerHTML = html;

            if (activeIndex >= 0) {
                const activeEl = lyricsContainer.querySelector('.lrc-line.active');
                if (activeEl) {
                    const containerRect = lyricsContainer.getBoundingClientRect();
                    const elRect = activeEl.getBoundingClientRect();
                    const offset = elRect.top - containerRect.top - containerRect.height / 2 + elRect.height / 2;
                    lyricsContainer.scrollTop += offset;
                }
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ================================================================
        //  音频事件
        // ================================================================
        function setupAudioEvents() {
            audio.addEventListener('loadedmetadata', function() {
                const dur = audio.duration;
                if (isFinite(dur)) {
                    totalTimeEl.textContent = formatTime(dur);
                    progressRange.max = 100;
                }
            });

            audio.addEventListener('timeupdate', function() {
                if (isDragging) return;
                const dur = audio.duration;
                if (isFinite(dur) && dur > 0) {
                    const pct = (audio.currentTime / dur) * 100;
                    progressFill.style.width = pct + '%';
                    progressRange.value = pct;
                    currentTimeEl.textContent = formatTime(audio.currentTime);
                    renderLyrics(audio.currentTime);
                }
            });

            audio.addEventListener('play', function() {
                isPlaying = true;
                playBtn.textContent = '⏸';
                playBtn.classList.remove('paused');
                statusBadge.textContent = '▶ 播放中';
            });

            audio.addEventListener('pause', function() {
                isPlaying = false;
                playBtn.textContent = '▶';
                playBtn.classList.add('paused');
                statusBadge.textContent = '⏸ 暂停';
            });

            audio.addEventListener('ended', function() {
                playNext();
            });

            audio.addEventListener('error', function(e) {
                console.warn('音频错误:', e);
                statusBadge.textContent = '⚠️ 加载失败';
                isPlaying = false;
                playBtn.textContent = '▶';
                playBtn.classList.add('paused');
            });

            audio.addEventListener('waiting', function() {
                statusBadge.textContent = '⏳ 缓冲中';
            });

            audio.addEventListener('canplay', function() {
                statusBadge.textContent = isPlaying ? '▶ 播放中' : '⏸ 暂停';
            });
        }

        // ================================================================
        //  播放控制
        // ================================================================
        function playSong(index) {
            if (index < 0 || index >= displayList.length) return;
            const item = displayList[index];
            if (!item || !item.urlStr) return;

            currentIndex = index;
            const url = getMp3Url(item.urlStr);
            const name = getSongName(item);

            currentSongName.textContent = name;
            currentSongName.classList.remove('empty');
            statusBadge.textContent = '⏳ 加载中...';
            playBtn.textContent = '⏸';
            playBtn.classList.remove('paused');

            renderSongList();
            audio.src = url;
            audio.load();
            // 使用新接口加载歌词
            loadLyrics(name);

            progressFill.style.width = '0%';
            progressRange.value = 0;
            currentTimeEl.textContent = '00:00';

            audio.play().catch(err => {
                console.warn('自动播放被阻止:', err);
                isPlaying = false;
                playBtn.textContent = '▶';
                playBtn.classList.add('paused');
                statusBadge.textContent = '⏸ 暂停 (点击播放)';
            });
        }

        function togglePlay() {
            if (displayList.length === 0) return;
            if (currentIndex === -1) {
                playSong(0);
                return;
            }
            if (audio.paused) {
                audio.play().catch(err => {
                    console.warn('播放失败:', err);
                    const item = displayList[currentIndex];
                    if (item) {
                        audio.src = getMp3Url(item.urlStr);
                        audio.load();
                        audio.play().catch(e => console.warn('重试播放失败:', e));
                    }
                });
            } else {
                audio.pause();
            }
        }

        function playPrev() {
            if (displayList.length === 0) return;
            if (currentIndex <= 0) {
                playSong(displayList.length - 1);
            } else {
                playSong(currentIndex - 1);
            }
        }

        function playNext() {
            if (displayList.length === 0) return;
            let nextIdx;
            if (playMode === 'random') {
                if (displayList.length === 1) {
                    nextIdx = 0;
                } else {
                    do {
                        nextIdx = Math.floor(Math.random() * displayList.length);
                    } while (nextIdx === currentIndex);
                }
            } else {
                nextIdx = (currentIndex + 1) % displayList.length;
            }
            playSong(nextIdx);
        }

        // ================================================================
        //  渲染列表
        // ================================================================
        function renderSongList() {
            if (displayList.length === 0) {
                songList.innerHTML = '<div class="empty-state">📭 暂无歌曲</div>';
                songCount.textContent = '0';
                return;
            }

            let html = '';
            for (let i = 0; i < displayList.length; i++) {
                const item = displayList[i];
                const name = getSongName(item);
                const isActive = (i === currentIndex);
                const activeClass = isActive ? 'active' : '';
                const indicator = isActive ? '▶' : '';
                html += `
                        <div class="song-item ${activeClass}" data-index="${i}">
                            <span class="index">${i + 1}</span>
                            <span class="name">${escapeHtml(name)}</span>
                            <span class="play-indicator">${indicator}</span>
                            <span class="duration"></span>
                        </div>
                    `;
            }
            songList.innerHTML = html;
            songCount.textContent = displayList.length;

            songList.querySelectorAll('.song-item').forEach(el => {
                el.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index, 10);
                    if (!isNaN(idx) && idx >= 0 && idx < displayList.length) {
                        if (idx === currentIndex && !audio.paused) {
                            audio.pause();
                        } else {
                            playSong(idx);
                        }
                    }
                });
            });
        }

        // ================================================================
        //  排序
        // ================================================================
        function applySort(order) {
            sortOrder = order;
            const sorted = [...musicData];
            sorted.sort((a, b) => {
                const na = getSongName(a).toLowerCase();
                const nb = getSongName(b).toLowerCase();
                if (order === 'asc') return na.localeCompare(nb, 'zh');
                else return nb.localeCompare(na, 'zh');
            });
            displayList = sorted;
            if (currentIndex >= 0 && currentIndex < displayList.length) {
                const currentItem = musicData[currentIndex];
                if (currentItem) {
                    const newIdx = displayList.findIndex(item => item.urlStr === currentItem.urlStr);
                    if (newIdx >= 0) currentIndex = newIdx;
                    else currentIndex = -1;
                } else {
                    currentIndex = -1;
                }
            } else {
                currentIndex = -1;
            }
            if (currentIndex === -1 && displayList.length > 0) {
                // 不自动播放
            }
            renderSongList();
            updateSortButtons();
            document.getElementById('sortLabel').textContent = order === 'asc' ? '▲ 正序' : '▼ 倒序';
        }

        function updateSortButtons() {
            sortAscBtn.classList.toggle('active', sortOrder === 'asc');
            sortDescBtn.classList.toggle('active', sortOrder === 'desc');
        }

        // ================================================================
        //  加载数据
        // ================================================================
        async function fetchMusicList() {
            try {
                statusBadge.textContent = '⏳ 加载列表中...';
                const resp = await fetch(API_URL);
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const json = await resp.json();
                const raw = json.data || [];
                if (!Array.isArray(raw) || raw.length === 0) {
                    musicData = [];
                    displayList = [];
                    renderSongList();
                    currentSongName.textContent = '暂无歌曲';
                    currentSongName.classList.add('empty');
                    statusBadge.textContent = '📭 无数据';
                    return;
                }
                musicData = raw.filter(item => item && item.urlStr && item.urlStr.trim() !== '');
                if (musicData.length === 0) {
                    displayList = [];
                    renderSongList();
                    currentSongName.textContent = '暂无有效歌曲';
                    currentSongName.classList.add('empty');
                    statusBadge.textContent = '📭 无有效歌曲';
                    return;
                }
                applySort(sortOrder);
                if (displayList.length > 0) {
                    currentIndex = -1;
                    const first = displayList[0];
                    currentSongName.textContent = getSongName(first);
                    currentSongName.classList.remove('empty');
                    loadLyrics(getSongName(first));
                    audio.src = getMp3Url(first.urlStr);
                    audio.load();
                    currentIndex = 0;
                    renderSongList();
                    statusBadge.textContent = '⏸ 已就绪';
                    playBtn.textContent = '▶';
                    playBtn.classList.add('paused');
                    totalTimeEl.textContent = '00:00';
                    currentTimeEl.textContent = '00:00';
                    progressFill.style.width = '0%';
                    progressRange.value = 0;
                }
            } catch (err) {
                console.error('获取音乐列表失败:', err);
                statusBadge.textContent = '❌ 加载失败';
                musicData = [];
                displayList = [];
                renderSongList();
                currentSongName.textContent = '加载失败，请检查网络';
                currentSongName.classList.add('empty');
            }
        }

        // ================================================================
        //  进度条拖拽
        // ================================================================
        function setupProgressDrag() {
            function setProgress(pct) {
                pct = Math.max(0, Math.min(100, pct));
                progressFill.style.width = pct + '%';
                progressRange.value = pct;
                const dur = audio.duration;
                if (isFinite(dur) && dur > 0) {
                    const time = (pct / 100) * dur;
                    currentTimeEl.textContent = formatTime(time);
                    renderLyrics(time);
                }
            }

            progressRange.addEventListener('input', function() {
                const pct = parseFloat(this.value);
                setProgress(pct);
                isDragging = true;
            });

            progressRange.addEventListener('change', function() {
                const pct = parseFloat(this.value);
                const dur = audio.duration;
                if (isFinite(dur) && dur > 0) {
                    audio.currentTime = (pct / 100) * dur;
                }
                isDragging = false;
                if (isFinite(dur) && dur > 0) {
                    renderLyrics(audio.currentTime);
                }
            });

            progressTrack.addEventListener('click', function(e) {
                const rect = this.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width;
                const pct = Math.max(0, Math.min(100, x * 100));
                setProgress(pct);
                const dur = audio.duration;
                if (isFinite(dur) && dur > 0) {
                    audio.currentTime = (pct / 100) * dur;
                    renderLyrics(audio.currentTime);
                }
                progressRange.value = pct;
            });
        }

        // ================================================================
        //  音量控制
        // ================================================================
        function setupVolume() {
            // 设置初始音量
            audio.volume = parseFloat(volumeSlider.value);
            updateVolumeIcon(audio.volume);

            volumeSlider.addEventListener('input', function() {
                const vol = parseFloat(this.value);
                audio.volume = vol;
                updateVolumeIcon(vol);
            });

            volIcon.addEventListener('click', function() {
                if (audio.volume > 0) {
                    // 静音：保存当前音量，设为0
                    audio.dataset.prevVolume = audio.volume;
                    audio.volume = 0;
                    volumeSlider.value = 0;
                    updateVolumeIcon(0);
                } else {
                    // 恢复音量
                    const prev = parseFloat(audio.dataset.prevVolume) || 0.8;
                    audio.volume = prev;
                    volumeSlider.value = prev;
                    updateVolumeIcon(prev);
                }
            });
        }

        function updateVolumeIcon(vol) {
            if (vol === 0) {
                volIcon.textContent = '🔇';
            } else if (vol < 0.5) {
                volIcon.textContent = '🔉';
            } else {
                volIcon.textContent = '🔊';
            }
        }

        // ================================================================
        //  模式切换
        // ================================================================
        function toggleMode() {
            if (playMode === 'sequential') {
                playMode = 'random';
                modeLabel.textContent = '随机';
            } else {
                playMode = 'sequential';
                modeLabel.textContent = '顺序';
            }
            statusBadge.textContent = isPlaying ? '▶ 播放中' : '⏸ 暂停';
        }

        // ================================================================
        //  键盘快捷键
        // ================================================================
        function setupKeyboard() {
            document.addEventListener('keydown', function(e) {
                if (e.target.tagName === 'INPUT') return;
                if (e.code === 'Space') {
                    e.preventDefault();
                    togglePlay();
                } else if (e.code === 'ArrowRight') {
                    e.preventDefault();
                    if (audio.duration && isFinite(audio.duration)) {
                        audio.currentTime = Math.min(audio.currentTime + 5, audio.duration);
                    }
                } else if (e.code === 'ArrowLeft') {
                    e.preventDefault();
                    if (audio.duration && isFinite(audio.duration)) {
                        audio.currentTime = Math.max(audio.currentTime - 5, 0);
                    }
                }
            });
        }

        // ================================================================
        //  初始化
        // ================================================================
        function init() {
            setupAudioEvents();
            setupProgressDrag();
            setupVolume();
            setupKeyboard();

            playBtn.addEventListener('click', togglePlay);
            prevBtn.addEventListener('click', playPrev);
            nextBtn.addEventListener('click', playNext);
            modeToggle.addEventListener('click', toggleMode);

            sortAscBtn.addEventListener('click', function() {
                if (sortOrder !== 'asc') applySort('asc');
            });
            sortDescBtn.addEventListener('click', function() {
                if (sortOrder !== 'desc') applySort('desc');
            });

            fetchMusicList();

            audio.addEventListener('loadedmetadata', function() {
                const dur = audio.duration;
                if (isFinite(dur)) {
                    totalTimeEl.textContent = formatTime(dur);
                }
            });

            audio.addEventListener('error', function() {
                if (currentIndex >= 0 && currentIndex < displayList.length) {
                    const item = displayList[currentIndex];
                    if (item) {
                        setTimeout(() => {
                            audio.src = getMp3Url(item.urlStr);
                            audio.load();
                        }, 2000);
                    }
                }
            });

            console.log('🎵 音乐播放器已启动 (音量 + 新歌词接口)');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

    })();
</script>

</body>
</html>
