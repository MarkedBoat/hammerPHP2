<script>


    domLoaded(function () {
        let rootDiv = kl.id('root_div');
        let itemListDiv = new Emt('div', 'class="item_list"');
        let videoPlayerDiv = new Emt('div', 'class="video_player_div hidden"');
        let playerControllerDiv = new Emt('div', 'class="video_player_ctrl_div "');
        let videoPlayer = new Emt('video', 'controls="controls"', '', {volume: 0.1});
        window.videoPlayer = videoPlayer;
        let volumeInput = new Emt('input', 'type="range" class="volume-input"', '', {max: 100, value: 5});
        let durationInput = new Emt('input', 'type="range" class="duration-input"', '', {max: 1000, value: 0, step: 1});

        let waveCanvas = new Emt('canvas', 'class="wave-canvas"');

        let delAllSrcBtn = kl.HTML.BUTTON_BUTTON('', 'del all src');
        let allDelSrcBtns = [];
        rootDiv.parentElement.insertBefore(delAllSrcBtn, rootDiv);
        rootDiv.addNodes([

            videoPlayerDiv.addNodes([
                playerControllerDiv,
                videoPlayer,
            ]),
            itemListDiv,

            kl.HTML.DIV(`class="common-tool-bar"`,).addNodes([
                waveCanvas,
                durationInput,
            ]),

        ]);
        document.body.append(volumeInput);

        let getVdieoSrc = (src) => {
            return `http://kl-laptop-2021:8001${src}`;
        }
        let functionPlay = (item) => {
            window.currItem = item;
            videoPlayerDiv.classList.remove('hidden');
            videoPlayer.volume = parseInt(volumeInput.value) / 100;
            videoPlayer.src = getVdieoSrc(item.src);

            console.log(videoPlayer);
            if (item.btn) {
                item.btn.classList.remove('hidden');

            }


            videoPlayer.play();
        }
        let functionPause = () => {
            videoPlayerDiv.classList.add('hidden');
            videoPlayer.pause();
        }

        let initWaveCanvas = () => {
            // ========== 核心部分：监听指定的 video 元素 ==========
            const video = videoPlayer;   // ⬅️ 您只需修改这里的 ID，或者直接传入 video 元素
            const canvas = waveCanvas;

            // 如果页面上没有找到 video 或 canvas，则静默退出
            if (!video || !canvas) {
                console.warn('需要 video 和 canvas 元素');
                return;
            }

            // ---------- 音频上下文 + 分析器 ----------
            let audioContext = null;
            let analyser = null;
            let source = null;
            let animationId = null;
            let dataArray = null;          // 存储时域数据

            // 画布上下文
            const ctx = canvas.getContext('2d');

            // 调整画布物理像素以适配显示 (防止模糊)
            function resizeCanvasToDisplay() {
                const w = canvas.clientWidth;
                const h = canvas.clientHeight;
                if (canvas.width !== w || canvas.height !== h) {
                    canvas.width = w || 800;
                    canvas.height = h || 140;
                }
            }

            window.addEventListener('resize', resizeCanvasToDisplay);
            resizeCanvasToDisplay();

            // ---------- 初始化音频链 (只调用一次) ----------
            function initAudio() {
                // 防止重复初始化
                if (audioContext && audioContext.state !== 'closed') return;

                try {
                    // 创建上下文 (处于 suspended 状态，需要用户手势或播放时恢复)
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 512;                      // 时域采样点数量
                    const bufferLength = analyser.fftSize;        // 512
                    dataArray = new Uint8Array(bufferLength);

                    // 创建媒体源 —— 绑定到 video 元素
                    source = audioContext.createMediaElementSource(video);

                    // 连接: source → analyser → 扬声器 (保证声音正常输出)
                    source.connect(analyser);
                    analyser.connect(audioContext.destination);

                    console.log('✅ 音频已连接，等待播放...');

                    // 如果 video 已经处于播放状态，则恢复上下文
                    if (!video.paused) {
                        audioContext.resume().catch(e => console.warn('自动恢复失败', e));
                    }

                    // 开始绘制循环
                    startLoop();

                } catch (err) {
                    console.error('音频初始化失败:', err);
                }
            }

            // ---------- 绘制循环 (RAF) ----------
            function drawWave() {
                if (!analyser || !dataArray || !audioContext || audioContext.state === 'closed') {
                    // 如果分析器未就绪，绘制灰色占位
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#0e1a26';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.font = '12px monospace';
                    ctx.fillStyle = '#3f5975';
                    ctx.textAlign = 'center';
                    ctx.fillText('等待音频...', canvas.width / 2, canvas.height / 2);
                    animationId = requestAnimationFrame(drawWave);
                    return;
                }

                // 获取时域数据 (振幅 0~255)
                analyser.getByteTimeDomainData(dataArray);

                // 绘制波形
                const width = canvas.width;
                const height = canvas.height;

                ctx.clearRect(0, 0, width, height);
                ctx.fillStyle = '#0e1a26';
                ctx.fillRect(0, 0, width, height);

                // 绘制中位基准线 (虚线)
                ctx.beginPath();
                ctx.strokeStyle = '#2f4b68';
                ctx.setLineDash([4, 6]);
                ctx.lineWidth = 1;
                ctx.moveTo(0, height / 2);
                ctx.lineTo(width, height / 2);
                ctx.stroke();
                ctx.setLineDash([]); // 恢复实线

                // 绘制波形线
                const sliceWidth = width / (dataArray.length - 1);
                let x = 0;

                ctx.beginPath();
                for (let i = 0; i < dataArray.length; i++) {
                    // 128 为中心参考值，v/128 使中心对应 1.0
                    const v = dataArray[i] / 128.0;
                    // y 轴翻转：v=1 时 y 在中点，v=2 时 y 在底部，v=0 时 y 在顶部
                    const y = height / 2 + (v - 1.0) * (height / 2) * 0.9;  // 0.9 防止溢出边缘

                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                    x += sliceWidth;
                }

                ctx.strokeStyle = '#6fe7dd';
                ctx.lineWidth = 2.5;
                ctx.shadowColor = '#6fe7dd66';
                ctx.shadowBlur = 10;
                ctx.stroke();
                ctx.shadowBlur = 0;

                // 继续下一帧
                animationId = requestAnimationFrame(drawWave);
            }

            function startLoop() {
                if (animationId) cancelAnimationFrame(animationId);
                animationId = requestAnimationFrame(drawWave);
            }

            // ---------- 监听 video 事件 (完全无侵入) ----------
            // 当用户开始播放时初始化并恢复上下文
            video.addEventListener('play', () => {
                // 如果还没初始化，立刻初始化
                if (!audioContext || audioContext.state === 'closed') {
                    initAudio();
                }
                // 恢复音频上下文 (从 suspended 到 running)
                if (audioContext && audioContext.state === 'suspended') {
                    audioContext.resume().catch(e => console.warn('resume 失败', e));
                }
            });

            // 如果视频预加载已完成，可以预先初始化 (但上下文保持 suspended)
            if (video.readyState >= 2) {  // HAVE_CURRENT_DATA 或更高
                initAudio();  // 内部会检测重复，创建 suspended 上下文
            } else {
                video.addEventListener('canplay', initAudio, {once: true});
            }

            // 可选：点击页面任意位置恢复音频 (应对严格自动播放策略)
            function resumeContext() {
                if (audioContext && audioContext.state === 'suspended') {
                    audioContext.resume().catch(() => {
                    });
                }
            }

            document.body.addEventListener('click', resumeContext);
            document.body.addEventListener('touchstart', resumeContext);

            // 清理动画 (非必须，但优雅)
            window.addEventListener('beforeunload', () => {
                if (animationId) cancelAnimationFrame(animationId);
                if (audioContext && audioContext.state !== 'closed') {
                    audioContext.close();
                }
            });
        }
        // initWaveCanvas();


        document.addEventListener('keydown', function (e) {
            console.log('keydown', e.code);
            // 37 l  38 top  39 right  40 down
            switch (e.code) {
                case'Enter':
                    console.log('player div ok');

                    if (videoPlayer.paused) {
                        videoPlayer.play();
                    } else {
                        videoPlayer.paused();
                    }
                    break;
                case 'Escape':
                case 'Backquote':
                    console.log('player div exit');
                    videoPlayerDiv.classList.add('hidden');
                    videoPlayer.pause();
                    break;
                case 'ArrowLeft':
                    videoPlayer.currentTime += 15;
                    break;
                case 'ArrowUp':
                    videoPlayer.volume += 0.02;
                    break;
                case 'ArrowRight':
                    videoPlayer.currentTime -= 15;
                    break;
                case 'ArrowDown':
                    videoPlayer.volume -= 0.02;
                    break;
            }
            // e.preventDefault();
            // return false;


        });


        durationInput.addEventListener('input', () => {
            //cli.log(durationInput.value);
            videoPlayer.currentTime = parseInt(durationInput.value / 1000 * videoPlayer.duration);
        });
        volumeInput.addEventListener('input', () => {
            //cli.log(durationInput.value);
            videoPlayer.volume = parseInt(volumeInput.value) / 100;
        });

        delAllSrcBtn.addEventListener('click', async () => {
            for (let i = 0; i < allDelSrcBtns.length; i++) {
                allDelSrcBtns[i].disabled = false;
                await allDelSrcBtns[i].delSrc();
            }
        });

        kl.ajax({
            url: '/dev/v1/KL_PC/xx/op/task/okList',
            data: {file: '/data/sysadv.debug'},
            success: function (file_result) {
                console.log(file_result);
                let list = kl.getValByPath(file_result, 'data.list');
                if (list && Array.isArray(list)) {
                    console.log(file_result);
                    list.forEach((videoInfo, i) => {
                        if (videoInfo.is_pre === 1) {
                            //  return false;
                        }
                        let fileKv = videoInfo?.fileKV;


                        let sizeM = parseInt(videoInfo.filesize / 1024 / 1024);
                        let srcInfo = videoInfo.src_video_info;
                        let taskManualInfo = kl.getValByPath(videoInfo, 'task_info.manual', {});
                        let srcTitle = `${videoInfo.id} ${videoInfo.video_title}.${videoInfo.video_ext} `;
                        let infospan = new Emt('span', '', '', {textContent: ''});


                        let dstSizeM = parseInt(videoInfo.dstFilesize / 1024 / 1024);
                        let dstInfo = videoInfo.dst_video_info;

                        let sizeRate = (videoInfo.dstFilesize * 100 / videoInfo.filesize).toFixed(2);

                        let srcDiv = new Emt('div', 'class="src"');
                        let dstDiv = new Emt('div', 'class="dst"');

                        let srcInfoDiv = new Emt('div', 'class="src-info"');
                        let dstInfoDiv = new Emt('div', 'class="src-info"');


                        let delSrcBtn = new Emt('button', 'type="button" class="hidden1"', 'DEL SRC', {disabled: true});
                        let delAllBtn = new Emt('button', 'type="button" class="hidden1"', '垃圾视频', {disabled: true});
                        let needPreFixBtn = new Emt('button', 'type="button" class="hidden1"', '需要前置处/pre理', {disabled: false});

                        let rollbackBtn = new Emt('button', 'type="button" class=""', 're_conv');
                        let moveAsUnformatBtn = new Emt('button', 'type="button" class=""', '作为未转码', {title: '转码结果需要二次处理，将成果文件挪到未转码目录'});


                        let opDiv = new Emt('div', 'class="op"');

                        let whRate = parseInt(srcInfo.width * 100 / srcInfo.height);
                        let whFlag = whRate >= 100 ? 'tv' : 'phone';
                        let videoInfoDiv = new Emt('div', 'class="conv-task"').addNodes([
                            srcDiv,

                            new Emt('div', 'class="compare"').addNodes([
                                srcInfoDiv.addNodes([
                                    kl.HTML.SPAN(`class="wh-rate-${whFlag}"`,),
                                    kl.HTML.EM('class="size"', `${srcInfo.width}X${srcInfo.height}`),
                                    kl.HTML.EM('class="file-size"', `${sizeM}M`),
                                    kl.HTML.EM('class="duration"', `${srcInfo.duration}s`),
                                    kl.HTML.EM('class="rate-k"', `${srcInfo.rateK}K`),
                                ]),
                                dstInfoDiv.addNodes([
                                    kl.HTML.SPAN(`class="wh-rate-${whFlag}"`,),
                                    kl.HTML.EM('class="size"', `${dstInfo.width}X${dstInfo.height}`),
                                    kl.HTML.EM('class="file-size"', `${dstSizeM}M`),
                                    kl.HTML.EM('class="duration"', `${dstInfo.duration}s`),
                                    kl.HTML.EM('class="rate-k"', `${dstInfo.rateK}K`),
                                ]),

                                infospan,
                            ]),

                            dstDiv.addNodes([]),
                            opDiv.addNodes([
                                rollbackBtn,
                                delSrcBtn,
                                delAllBtn,
                                needPreFixBtn,
                                moveAsUnformatBtn,
                            ]),
                        ]);

                        allDelSrcBtns.push(delSrcBtn);

                        let dirname = false;
                        if (videoInfo.album_dir === '') {
                            itemListDiv.addNode(videoInfoDiv);
                        } else {
                            if (itemListDiv[videoInfo.album_dir] === undefined) {
                                itemListDiv[videoInfo.album_dir] = new Emt('div', 'class="dir-conv-task"');
                                itemListDiv[videoInfo.album_dir].videoInfos = [];
                                let dirOpBtn = new Emt('button', 'type="button" class=""', '清理目录');


                                itemListDiv.addNode(itemListDiv[videoInfo.album_dir].addNodes([
                                    new Emt('p').addNodes([
                                        new Emt('strong', '', videoInfo.album_dir), dirOpBtn,
                                    ])
                                ]));
                                dirOpBtn.addEventListener('click', async () => {
                                    if (window.confirm('确定清理目录?') === false) {
                                        return false;
                                    }
                                    let pairInfos = {};
                                    for (const [tmp_j, videoInfoObj] of itemListDiv[videoInfo.album_dir].videoInfos.entries()) {
                                        videoInfoObj.delSrcBtn.disabled = false;
                                        await videoInfoObj.delSrcBtn.delSrc();
                                    }
                                });
                            }

                            opDiv.addNodes([])


                            itemListDiv[videoInfo.album_dir].addNode(videoInfoDiv);
                            itemListDiv[videoInfo.album_dir].videoInfos.push({
                                videoInfo: videoInfo,
                                delSrcBtn: delSrcBtn,
                            });

                        }


                        let items = [];

                        let updateTaskFun = async function (extParam) {

                            await kl.ajax({
                                url: '/dev/v1/KL_PC/xx/op/task/update',
                                data: {id: videoInfo.id, attrs: {is_ok: 2, run_lc: 0}},
                                type: 'json',
                                async: true,
                            }).then(aysncRes => {
                                console.log(aysncRes.result);
                                videoInfoDiv.remove();

                            });
                        }

                        if (videoInfo.src) {
                            console.log(videoInfo.src);
                            items.push(videoInfo.src);
                            let playSrcBtn = new Emt('button', 'type="button" class="play_btn"', srcTitle);
                            srcDiv.addNode(playSrcBtn);

                            playSrcBtn.addEventListener('click', () => {
                                console.log('play:', videoInfo);
                                event.preventDefault(); //阻止冒泡
                                functionPlay(videoInfo);
                            });

                            rollbackBtn.addEventListener('click', async () => {
                                console.log('rollback:', videoInfo);
                                await updateTaskFun({id: videoInfo.id, attrs: {is_ok: 2, run_lc: 0}});

                            });
                            needPreFixBtn.addEventListener('click', async () => {
                                console.log('needPreFixBtn:', videoInfo);
                                await updateTaskFun({id: videoInfo.id, attrs: {is_ok: 2, run_lc: 0, is_pre: 1}});

                            });
                        }

                        delSrcBtn.delSrc = async function () {
                        };
                        if (videoInfo.dst) {

                            let delFun = async function (extParamKV) {
                                if (extParamKV === undefined) {
                                    extParamKV = {};
                                }
                                try {
                                    const res = await kl.ajax({
                                        url: '/dev/v1/KL_PC/xx/op/task/finish',
                                        data: Object.assign({id: videoInfo.id}, extParamKV),
                                        type: 'json',
                                        async: true,
                                    });
                                    console.log(res.result);
                                    if (kl.getValByPath(res, 'result.data.src_exist') === false) {
                                        videoInfoDiv.remove();          // 移除对应的视频卡片
                                    } else {
                                        this.textContent = 'error';
                                        console.error( res.result);
                                    }
                                } catch (error) {
                                    this.textContent = 'error';
                                    console.error('删除失败', error);
                                } finally {
                                    // 可选：操作完成后重置状态，允许再次点击（如果需要）
                                    // this.isClicked = false;
                                }
                            }
                            let playResBtn = new Emt('button', 'type="button" class="play_btn"', `RES ${sizeRate}%`);
                            dstDiv.addNode(playResBtn);

                            playResBtn.addEventListener('click', () => {
                                delSrcBtn.disabled = false;
                                delAllBtn.disabled = false;

                                console.log('play dst:', videoInfo);
                                console.log(videoInfo.dst);

                                event.preventDefault(); //阻止冒泡
                                functionPlay({type: 'dst', src: videoInfo.dst, btn: delSrcBtn});
                            });

                            // 挂载异步删除方法
                            delSrcBtn.delSrc = async function () {
                                // 防止重复点击（方法内控制）
                                if (this.isClicked) return;
                                this.isClicked = true;
                                this.textContent = 'src deleting';
                                await delFun();

                            };


                            delSrcBtn.addEventListener('click', async () => {
                                await delSrcBtn.delSrc();
                            });
                            delAllBtn.addEventListener('click', async () => {
                                if (this.isClicked) return;
                                this.isClicked = true;
                                this.textContent = 'all deleting';
                                await delFun({isRubish: 'yes'});
                            });


                            moveAsUnformatBtn.addEventListener('click', async () => {
                                if (window.prompt('确定？会删除原src的,确定输入[1]') === '1') {
                                    await kl.ajax({
                                        url: '/dev/v1/KL_PC/xx/moveAsUnformatVideo',
                                        data: {id: videoInfo.id, attrs: {is_ok: 2, run_lc: 0}},
                                        type: 'json',
                                        async: true,
                                    }).then(aysncRes => {
                                        console.log(aysncRes.result);
                                        videoInfoDiv.remove();

                                    });
                                }


                            });


                        }


                    });
                } else {
                    alert(file_result.msg || '未知');
                }
            },
            type: 'json'
        });


    })

</script>
